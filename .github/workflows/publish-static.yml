name: Build static application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish static application
    uses: troyeagle/troyeagle.github.io/.github/workflows/build-static-app.yml@08201b012b9d4058b6320f649b68ea36a2b9e020
    with:
      app: countdown
      publisher_ref: 08201b012b9d4058b6320f649b68ea36a2b9e020
    secrets:
      BLOG_DISPATCH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
